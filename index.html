<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistem Perpustakaan</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="eyebrow">LIBRARY MANAGEMENT</p><h1>Perpustakaan</h1></div><button id="add">+ Tambah Buku</button></header><section class="stats"><div><span>Total buku</span><b id="total">0</b></div><div><span>Tersedia</span><b id="available">0</b></div><div><span>Dipinjam</span><b id="borrowed">0</b></div></section><input id="search" class="search" placeholder="Cari judul atau penulis..."><section id="books"></section></main><dialog id="dialog"><form id="form"><h2>Tambah Buku</h2><input id="title" placeholder="Judul buku" required><input id="author" placeholder="Penulis" required><input id="year" type="number" placeholder="Tahun" required><button>Tambah</button></form></dialog><script src="script.js"></script></body></html>
